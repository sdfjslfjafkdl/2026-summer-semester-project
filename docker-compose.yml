# 로컬 개발용. 소스를 바인드 마운트해서 --reload 가 돌게 한다.
#
#   docker compose up --build
#
# 배포 이미지와 다른 점: 소스를 이미지에서 쓰지 않고 호스트에서 읽으며,
# 코드가 바뀌면 uvicorn 이 알아서 다시 뜬다.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    # .env 를 그대로 읽는다. ANTHROPIC_API_KEY 도 여기서만 들어가고 이미지에는 남지 않는다.
    env_file:
      - .env
    environment:
      APP_ENV: local
      PORT: "8000"
      # 컨테이너 안의 캐시 경로. 아래 named volume 에 쓰인다.
      INDEX_DIR: /app/data/runtime/index
      # .env 에 없을 때만 쓰이는 기본값 (있으면 .env 가 이긴다)
      CORS_ORIGINS: ${CORS_ORIGINS:-https://impact-advisor-ai.lovable.app,http://localhost:3000,http://localhost:5173}
    volumes:
      # 소스 바인드 마운트 → 저장하면 바로 리로드
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ./data/raw:/app/data/raw:ro
      # 아티팩트는 빌드 스테이지 산출물을 그대로 쓴다(마운트하지 않는다).
      # 근거 검색 캐시만 쓰기 가능한 볼륨으로 둔다. Railway 볼륨과 같은 자리.
      - evidence-index:/app/data/runtime
    command: >
      sh -c "exec uvicorn app.main:app
      --host 0.0.0.0 --port ${PORT:-8000}
      --reload --reload-dir /app/app"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  evidence-index:
